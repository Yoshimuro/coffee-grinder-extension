<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything other than zero on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Тем две (BJ-9). Оба значения ниже — стартовые, тёмные: тёмная тема
         остаётся умолчанием, и всё, что рисуется до скрипта, выглядит как
         раньше. Скрипт ниже правит их за один синхронный проход. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0C0C0C" />
    <script>
      /*
       * Тема до первого кадра.
       *
       * Настройка живёт в IndexedDB, а та отвечает асинхронно — то есть уже
       * после того, как браузер покрасит страницу. Синхронно прочитать можно
       * только localStorage, поэтому выбор в него зеркалится
       * (`db/repo/settings.ts`, ключ `bj-theme`), а этот скрипт — единственный
       * его читатель на старте.
       *
       * Скрипт инлайновый и стоит до бандла намеренно: внешний файл — это ещё
       * один сетевой раунд, ровно в том месте, где мы боремся за один кадр.
       *
       * Пустое, чужое или битое значение — тёмная тема, то есть поведение до
       * BJ-9. Приватный режим кидается на сам доступ к localStorage, оттого
       * try/catch снаружи, а не вокруг одной строки.
       *
       * Два хекса ниже продублированы из `THEME_COLOR` в `src/ui/theme.ts`:
       * этот скрипт выполняется до бандла, импортировать ему неоткуда.
       * Расхождение ловит `tests/unit/theme.test.ts`.
       */
      try {
        var pref = localStorage.getItem('bj-theme');
        if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'dark';
        var theme =
          pref === 'system'
            ? matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : pref;
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'light' ? '#F7F7F4' : '#0C0C0C');
      } catch (e) {
        /* хранилище недоступно — остаёмся на тёмной */
      }
    </script>
    <!-- PWA: манифест и иконка домашнего экрана. Пути относительные — как и
         весь бандл (`base: './'`), иначе установка из подкаталога сломается. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>brew journal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
