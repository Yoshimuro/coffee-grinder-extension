name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journal:
    # Playwright 1.56 supports Ubuntu 24.04, not the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:journal
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:journal
      - run: npm run test:production:journal
      - name: Upload journal test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: journal-test-results
          path: |
            apps/journal/test-results/
            apps/journal/playwright-report/
          retention-days: 7

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs first: everything downstream is built from this data, so a bad
      # calibration should fail here rather than as a confusing test failure.
      - name: Validate dataset
        run: npm run check:data

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      # The full Chromium build, not headless-shell — headless-shell ignores
      # --load-extension, so the E2E suite would silently test nothing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/extension/playwright-report/
          retention-days: 7

      - name: Upload built extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-unpacked
          path: apps/extension/dist/
          retention-days: 7
